# Construit la version web du jeu à chaque modification,
# et la publie sur GitHub Pages quand la branche main change.
name: Version web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Tests et export web
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Installer les modèles d'export Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi

      - name: Numéro de version (affiché dans le menu)
        run: sed -i "s/^const TEXT := .*/const TEXT := \"${GITHUB_RUN_NUMBER}\"/" scripts/build_version.gd

      - name: Importer le projet
        run: godot --headless --import

      - name: Tests automatiques
        run: |
          timeout 300 godot --headless --fixed-fps 60 res://tests/sim_test.tscn 2>&1 | tee test.log
          grep -q "ECHECS: 0" test.log

      - name: Export web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publication sur GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
