html/head_include="<meta name='mobile-web-app-capable' content='yes'>
<style>
#plein-ecran{position:fixed;left:12px;bottom:12px;z-index:10;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,0.18);display:none;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
#plein-ecran svg{width:24px;height:24px}
</style>
<script>
(function(){
var d=document,e=d.documentElement;
var ok=!!(e.requestFullscreen||e.webkitRequestFullscreen);
var tel=window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;
function enPlein(){return !!(d.fullscreenElement||d.webkitFullscreenElement);}
function paysage(){try{var o=screen.orientation;if(o&&o.lock){o.lock('landscape').catch(function(){});}}catch(x){}}
function plein(){
if(enPlein()){paysage();return;}
try{var p=e.requestFullscreen?e.requestFullscreen({navigationUI:'hide'}):e.webkitRequestFullscreen();
if(p&&p.then){p.then(paysage).catch(function(){});}else{paysage();}}catch(x){}
}
window.pleinEcran=plein;
if(!ok||!tel){return;}
var auto=false;
window.addEventListener('pointerup',function(){if(!auto){auto=true;plein();}},true);
d.addEventListener('DOMContentLoaded',function(){
var b=d.createElement('button');b.id='plein-ecran';b.setAttribute('aria-label','Plein écran');
var ns='http://www.w3.org/2000/svg',g=d.createElementNS(ns,'svg'),pa=d.createElementNS(ns,'path');
g.setAttribute('viewBox','0 0 24 24');pa.setAttribute('d','M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5');
pa.setAttribute('fill','none');pa.setAttribute('stroke','white');pa.setAttribute('stroke-width','2.5');pa.setAttribute('stroke-linecap','round');
g.appendChild(pa);b.appendChild(g);
b.addEventListener('pointerup',function(ev){ev.stopPropagation();auto=true;plein();});
d.body.appendChild(b);
function maj(){b.style.display=enPlein()?'none':'flex';}
d.addEventListener('fullscreenchange',maj);d.addEventListener('webkitfullscreenchange',maj);maj();
});
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
